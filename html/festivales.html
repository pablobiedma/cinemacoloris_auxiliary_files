<!DOCTYPE html>

<head>

    <title>Festivales - Cinema Coloris</title>
    <link rel="stylesheet" href="../css/magnus.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script>(function(html){html.className = html.className.replace(/\bno-js\b/,'js')})(document.documentElement);</script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #333333;
            color: #fae6c5;
        }
        .container {
            width: 80%;
            margin: auto;
            padding: 20px;
        }
        .post {
            display: flex;
            align-items: center;
            background: rgba(33, 33, 33, 0.5);
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
        }
        .post img {
            width: 150px;
            height: 100px;
            object-fit: cover;
            border-radius: 5px;
            margin-right: 20px;
        }
        .post-content {
            flex-grow: 1;
        }
        .post-title {
            font-size: 1.5em;
            color: #fdbd75;
            text-decoration: none;
        }
        .post-title:hover {
            color: #fae6c5;
        }
        .post-excerpt {
            color: #ccc;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <header>
        <h1 style="text-align: center;">Festivales</h1>
    </header>
    <div class="container" id="posts-container">
        <!-- Blog posts will be loaded here dynamically -->
    </div>

    <script>

        const posts = [

            },

            },

                excerpt: "Un grifo viejo y oxidado, el agua fluye con dificultad por las cañerías, un par de golpes de martillo le vendrían bien para que el agua saliera...",

            },

            {

                image: "../images/galardon.jpg",
                link: "post-trece-primeras-peliculas.html"
            },
        ];

        function loadPosts() {
            const container = document.getElementById("posts-container");
            posts.forEach(post => {
                const postElement = document.createElement("div");
                postElement.classList.add("post");
                postElement.innerHTML = `
                    <img src="${post.image}" alt="${post.title}">
                    <div class="post-content">
                        <a href="${post.link}" class="post-title">${post.title}</a>
                        <p class="post-excerpt">${post.excerpt}</p>
                    </div>
                `;
                container.appendChild(postElement);
            });
        }

        document.addEventListener("DOMContentLoaded", loadPosts);
    </script>
