<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" type="image/x-icon" href="../images/p.png">
    <title>Entrevistas - Cinema Coloris</title>
    <link rel="stylesheet" href="../css/magnus.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script>(function(html){html.className = html.className.replace(/\bno-js\b/,'js')})(document.documentElement);</script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #333333;
            color: #fae6c5;
        }
        .container {
            width: 80%;
            margin: auto;
            padding: 20px;
        }
        .post {
            display: flex;
            align-items: center;
            background: rgba(33, 33, 33, 0.5);
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
        }
        .post img {
            width: 150px;
            height: 100px;
            object-fit: cover;
            border-radius: 5px;
            margin-right: 20px;
        }
        .post-content {
            flex-grow: 1;
        }
        .post-title {
            font-size: 1.5em;
            color: #fdbd75;
            text-decoration: none;
        }
        .post-title:hover {
            color: #fae6c5;
        }
        .post-excerpt {
            color: #ccc;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <header>
        <h1 style="text-align: center;">Entrevistas</h1>
    </header>
    <div class="container" id="posts-container">
        <!-- Blog posts will be loaded here dynamically -->
    </div>

    <script>
        // Sample blog posts (we will replace this with XML-parsed data later)
        const posts = [
            {
                title: "Una película rodada a 2000m de altura. Entrevistamos a su director",
                excerpt: "Nuestra llegada a San Sebastián fue recibida con entusiasmo por el departamento de prensa del Festival quienes...",
                image: "../images/thomas.jpg",
                link: "post-thomas-salvador.html"
            },
            {
                title: "Entrevista a Eduardo Torres-Dulce (I)",
                excerpt: "En el momento actual, ¿cómo introducirías a John Ford a alguien que lo desconozca?",
                image: "../images/torres.jpg",
                link: "post-eduardo-torres-dulce-1.html"
            },
            {
                title: "Entrevista a Eduardo Torres Dulce (II)",
                excerpt: "John Ford, siempre con esa terquedad y personalidad tan opaca, se refería a su trabajo cuando...",
                image: "../images/torres.jpg",
                link: "post-eduardo-torres-dulce-2.html"
            },
            {
                title: "Entrevista a Daniel Peña",
                excerpt: "Hemos tenido el placer de poder entrevistar a Daniel Peña, editor y supervisor de sonido.",
                image: "../images/daniel.jpg",
                link: "post-daniel.html"
            }
        ];

        function loadPosts() {
            const container = document.getElementById("posts-container");
            posts.forEach(post => {
                const postElement = document.createElement("div");
                postElement.classList.add("post");
                postElement.innerHTML = `
                    <img src="${post.image}" alt="${post.title}">
                    <div class="post-content">
                        <a href="${post.link}" class="post-title">${post.title}</a>
                        <p class="post-excerpt">${post.excerpt}</p>
                    </div>
                `;
                container.appendChild(postElement);
            });
        }

        document.addEventListener("DOMContentLoaded", loadPosts);
    </script>
<footer>
    <style>
        
footer {
background: black;
display: table;
width: 100vw;
height: 4rem;
text-align: center;
padding: 1rem;
font-family: 'Arial', sans-serif;
font-size: .875rem;
}
.wrapper {
display: table-cell;
vertical-align: middle;
}
footer small {
color: #ccc;
}


    </style>
    <div class="wrapper">
      <small>&copy;2025 <strong>Revista Cinema Coloris</strong>, All Rights Reserved</small>
    </div>
  </footer>
</html>
</body>
</html>
