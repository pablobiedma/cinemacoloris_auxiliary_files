<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Populares - Cinema Coloris</title>
    <link rel="stylesheet" href="../css/magnus.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script>(function(html){html.className = html.className.replace(/\bno-js\b/,'js')})(document.documentElement);</script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #333333;
            color: #fae6c5;
        }
        .container {
            width: 80%;
            margin: auto;
            padding: 20px;
        }
        .post {
            display: flex;
            align-items: center;
            background: rgba(33, 33, 33, 0.5);
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
        }
        .post img {
            width: 150px;
            height: 100px;
            object-fit: cover;
            border-radius: 5px;
            margin-right: 20px;
        }
        .post-content {
            flex-grow: 1;
        }
        .post-title {
            font-size: 1.5em;
            color: #fdbd75;
            text-decoration: none;
        }
        .post-title:hover {
            color: #fae6c5;
        }
        .post-excerpt {
            color: #ccc;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <header>
        <h1 style="text-align: center;">Populares</h1>
    </header>
    <div class="container" id="posts-container">
        <!-- Blog posts will be loaded here dynamically -->
    </div>

    <script>
        // Sample blog posts (we will replace this with XML-parsed data later)
        const posts = [
            {
                title: "El chico de 100 años",
                excerpt: "Un análisis sobre la obra de Chaplin, El Chico, (1921).",
                image: "../images/el-chico.jpg",
                link: "post-el-chico.html"
            },
            {
                title: "Los límites de la venganza en el mundo de lo injusto.",
                excerpt: "Exploramos el conflicto moral en 'El manantial de la doncella' de Bergman.",
                image: "../images/manantial.jpg",
                link: "post-limites-venganza.html"
            }
        ];

        function loadPosts() {
            const container = document.getElementById("posts-container");
            posts.forEach(post => {
                const postElement = document.createElement("div");
                postElement.classList.add("post");
                postElement.innerHTML = `
                    <img src="${post.image}" alt="${post.title}">
                    <div class="post-content">
                        <a href="${post.link}" class="post-title">${post.title}</a>
                        <p class="post-excerpt">${post.excerpt}</p>
                    </div>
                `;
                container.appendChild(postElement);
            });
        }

        document.addEventListener("DOMContentLoaded", loadPosts);
    </script>
</body>
</html>
